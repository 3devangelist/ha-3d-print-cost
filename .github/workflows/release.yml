name: Release check

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    name: manifest version matches the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VERSION=$(jq -r .version custom_components/fdm_printer_manager/manifest.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::manifest.json version ($VERSION) does not match tag ($TAG)"
            exit 1
          fi
