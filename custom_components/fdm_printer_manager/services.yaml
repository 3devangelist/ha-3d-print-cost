mark_print:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: fdm_printer_manager
    result:
      required: true
      selector:
        select:
          options:
            - "success"
            - "failed"
          translation_key: mark_result
    job_id:
      required: false
      selector:
        text:
babystep:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: fdm_printer_manager
    direction:
      required: false
      selector:
        select:
          options:
            - "up"
            - "down"
          translation_key: babystep_direction
    step:
      required: false
      default: 0.01
      selector:
        select:
          options:
            - "0.005"
            - "0.01"
            - "0.025"
            - "0.05"
    reset:
      required: false
      default: false
      selector:
        boolean:
    save:
      required: false
      default: false
      selector:
        boolean:
sheets_setup:
  fields:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: google_sheets
    worksheet:
      required: false
      example: "Prints"
      selector:
        text:
    entry_id:
      required: false
      selector:
        config_entry:
          integration: fdm_printer_manager
keep_on:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: fdm_printer_manager
force_power_off:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: fdm_printer_manager
    confirm:
      required: true
      selector:
        boolean:
set_material:
  fields:
    entry_id:
      required: true
      selector:
        config_entry:
          integration: fdm_printer_manager
    job_id:
      required: true
      selector:
        text:
    material:
      required: true
      selector:
        select:
          options:
            - "PLA"
            - "PLA-CF"
            - "PETG"
            - "PETG-CF"
            - "PET"
            - "PET-CF"
            - "ABS"
            - "ASA"
            - "TPU"
            - "PC"
            - "PA"
            - "PP"
            - "PPA"
            - "PPS"
